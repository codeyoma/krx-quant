# The engine on the always-on server. From the repository root:
#
#   docker compose up -d --build
#
# Settings come from .env, which deploy/secure-env.sh keeps at mode 600.
# KRX_BIND_ADDRESS must be the server's Tailscale IPv4 (`tailscale ip -4`;
# deploy/setup-server.sh writes it): the engine port is published on that
# address only, never on every interface. Docker's published ports bypass ufw,
# so binding the address is what keeps the port off the internet.
name: krx-quant

services:
  engine:
    build:
      context: .
      args:
        # The commit built, set by deploy/auto-update.sh; "unknown" when built by hand.
        KRX_COMMIT: ${KRX_COMMIT:-unknown}
    image: krx-quant:latest
    command: ["collect"]
    env_file: .env
    environment:
      KRX_DATA_DIR: /data
      KRX_STATE_DIR: /state
      # The Engine API listens on every container interface; the published port below
      # keeps it on the Tailscale address.
      KRX_API_HOST: 0.0.0.0
      KRX_API_PORT: "8080"
    volumes:
      - ./data:/data
      - ./state:/state
    ports:
      # The Engine API listens on 8080 inside the container (docs/engine-api.md).
      - "${KRX_BIND_ADDRESS:?set KRX_BIND_ADDRESS to the Tailscale IPv4 (tailscale ip -4)}:${KRX_ENGINE_PORT:-8080}:8080"
    restart: unless-stopped
    # The collector flushes buffered rows and open gaps on SIGTERM.
    stop_grace_period: 30s
    # Docker keeps this output only while the container lives (the 06:00 deploy makes a new
    # one); every process also sends its lines to Grafana Cloud Loki when KRX_LOKI_* are set (#358).
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
