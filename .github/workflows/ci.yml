name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # About four times a usual run (11-22 minutes): a stuck job fails here, not after 6 hours.
    timeout-minutes: 60
    steps:
      # The fincept/ submodule is not needed for engine checks.
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --frozen
      - name: Forbidden patterns (order code, secrets)
        run: uv run python scripts/check_forbidden.py
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -q
