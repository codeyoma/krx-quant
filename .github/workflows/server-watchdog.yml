# Reboots the Lightsail server when its OS has hung, and says so in an issue (#385).
#
# On 2026-10-28 the server's OS stopped for almost 12 hours: Lightsail's instance status check
# failed every minute and nobody could reboot it. Every 10 minutes this reads the instance's state,
# its status checks and its recent reboots, and reboots it when the instance check has failed for
# 15 minutes; never twice within an hour, and after two reboots in three hours it gives up
# (scripts/server_watchdog.py, docs/operations.md "서버가 멈추면 (#385)").
#
# AWS access is the access key of the IAM user krx-quant-watchdog, in the repository secrets
# AWS_WATCHDOG_ACCESS_KEY_ID and AWS_WATCHDOG_SECRET_ACCESS_KEY. Its one inline policy reads the
# server's health and reboots that one instance (deploy/watchdog-policy.json).
# deploy/create-watchdog-user.sh makes the user and puts the key into the secrets; running it
# again rotates the key. The account's service control policy denies GitHub's OIDC provider, so
# there is no role to take (#387). Without both secrets the run does nothing. To stop the
# watchdog: gh workflow disable server-watchdog --repo codeyoma/krx-quant, or delete the secrets.
name: server-watchdog

on:
  schedule:
    # Every 10 minutes, off the top of the hour, when GitHub delays scheduled runs the most.
    - cron: "4-59/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide and show it on the run's page only: no reboot, no issue, no Telegram"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write # the issue it reports on

# One run at a time; a run that starts meanwhile waits for it (the running one is not cancelled).
concurrency:
  group: server-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Is the AWS key set?
        id: key
        env:
          KEY_ID: ${{ secrets.AWS_WATCHDOG_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_WATCHDOG_SECRET_ACCESS_KEY }}
        run: |
          if [[ -z "$KEY_ID" || -z "$SECRET_KEY" ]]; then
            echo "::notice::AWS_WATCHDOG_ACCESS_KEY_ID or AWS_WATCHDOG_SECRET_ACCESS_KEY is not set: the watchdog does nothing (deploy/create-watchdog-user.sh)"
            echo "set=false" >>"$GITHUB_OUTPUT"
          else
            echo "set=true" >>"$GITHUB_OUTPUT"
          fi

      # Only the script: no submodule, no project install (it is standard library only).
      - uses: actions/checkout@v4
        if: steps.key.outputs.set == 'true'
        with:
          submodules: false
          sparse-checkout: scripts

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.key.outputs.set == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_WATCHDOG_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_WATCHDOG_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
          mask-aws-account-id: true

      - name: Decide, reboot when it must, report
        if: steps.key.outputs.set == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INSTANCE: krx-quant
          AWS_PAGER: ""
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/server_watchdog.py
