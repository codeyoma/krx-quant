name: pr-refs

# An issue a pull request names after "Refs" must stay open when it merges
# (scripts/check_pr_refs.py). PR #340 and #341 closed #310 and #314 that way.
#
# A workflow of its own, not a job in ci.yml: it runs again when the body is edited. In ci.yml
# an edit would start the 11-22 minute test job again, or, skipped, the job's "skipped" result
# would take the place of an earlier failure on the same commit.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: pr-refs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only the script: no submodule, no project install.
      - uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: scripts
      - name: Issues named after "Refs" stay open on merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/check_pr_refs.py "$REPO" "$PR"
