[project]
name = "krx-quant"
version = "0.1.0"
description = "Personal KRX 4-minute price prediction engine (signals only)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiohttp>=3.10",
    "pyarrow>=17",
    "python-dotenv>=1.0",
]

[project.scripts]
krx-quant = "krx_quant.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krx_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["fincept"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
