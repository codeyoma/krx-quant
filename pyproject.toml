[project]
name = "krx-quant"
version = "0.1.0"
description = "Personal KRX 4-minute price prediction engine (signals only)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiohttp>=3.10",
    "boto3>=1.35",
    "cryptography>=44",
    "lightgbm>=4.7.0",
    "numpy>=2.4.6",
    "pyarrow>=17",
    "python-dotenv>=1.0",
]

[project.scripts]
krx-quant = "krx_quant.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "moto[s3]>=5.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
    "ruff>=0.6",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krx_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Collector tests drive real sockets and timers; fail a stuck one instead of hanging CI.
timeout = 30
# A test past its limit ends the run with every thread's stack. The signal method raises the
# timeout in the main thread; landing in an asyncio callback, it is dropped and the run waits
# forever (tests/test_timeouts.py).
timeout_method = "thread"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "boto3", "boto3.*", "botocore.*", "moto"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["fincept"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
