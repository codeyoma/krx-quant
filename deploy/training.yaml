# The nightly training on EC2 Spot and the cost cap (#23), in the Region of the S3 bucket
# and the Lightsail server. Steps: docs/operations.md, "밤 학습을 EC2 Spot으로 옮기기".
#
#   aws cloudformation deploy --stack-name krx-quant-training \
#     --template-file deploy/training.yaml --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides Bucket=<the bucket of deploy/create-aws.sh>
#
# What it makes:
# - an ECR repository the server pushes the engine's image to (deploy/push-image.sh);
# - a launch template: a one-time Spot instance that pulls the image, runs
#   `krx-quant train --from-store` and terminates itself when done, failed or not, and at
#   the latest after MaxMinutes;
# - two EventBridge Scheduler schedules that start it on weekday nights (the second one,
#   after the first can have run, resumes a night a reclaimed Spot instance cut short; a
#   night already done is skipped in minutes);
# - a monthly cost budget, read by the server's Cost Guard, which tells Telegram at half
#   and four fifths of it and turns the schedules off at it (src/krx_quant/cost_guard.py);
# - least-privilege roles for the instance and the scheduler, and a policy for the
#   server's IAM user: push the image, read the budget, turn the schedules off and on.
#
# The instance holds no secret: it reads and writes the bucket with its role, and the
# server sends the night's summary to Telegram.
AWSTemplateFormatVersion: "2010-09-09"
Description: krx-quant nightly training on EC2 Spot, and the monthly cost cap (#23)

Metadata:
  cfn-lint:
    config:
      # ImageId is a String on purpose: "resolve:ssm:..." makes EC2 look the image up at
      # each launch, where an image-id parameter would fix it when the stack is deployed.
      ignore_checks: [W2506]

Parameters:
  Bucket:
    Type: String
    Description: The S3 bucket the engine records to (deploy/create-aws.sh).
  Prefix:
    Type: String
    Default: engine
    Description: The prefix of the Object Store in it (KRX_OBJECT_STORE=s3://<Bucket>/<Prefix>).
  EngineUser:
    Type: String
    Default: krx-quant-engine
    Description: The IAM user whose keys the server's engine uses.
  InstanceType:
    Type: String
    Default: m6i.large
    Description: >-
      x86_64, as the server builds the image. CPU by default; a GPU type (g4dn.xlarge) only
      once a neural algorithm needs it, after checking the account's GPU Spot quota.
  TrainAt:
    Type: String
    Default: cron(30 21 ? * MON-FRI *)
    Description: When the night's training starts (Asia/Seoul); keep KRX_TRAIN_AT the same.
  ResumeAt:
    Type: String
    Default: cron(0 2 ? * TUE-SAT *)
    Description: >-
      A second start (Asia/Seoul) that resumes a night a reclaimed instance cut short. Keep it
      at least MaxMinutes after TrainAt, so the two never run at once, and MaxMinutes before
      07:30, when the server stops waiting.
  MaxMinutes:
    Type: Number
    Default: 240
    MinValue: 30
    Description: The instance terminates itself after this long, whatever it is doing.
  ImageId:
    Type: String
    Default: resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: >-
      The machine image, looked up at each launch. A GPU type needs one with its drivers
      (and the engine image built for it), once a neural algorithm needs it.
  VolumeGiB:
    Type: Number
    Default: 30
    MinValue: 20
  MonthlyBudget:
    Type: Number
    Default: 100
    Description: The month's cost cap in USD, for the whole account.

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: krx-quant
      ImageTagMutability: MUTABLE
      # Deleting the stack deletes the images too.
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules": [{"rulePriority": 1, "description": "keep the last 3 images",
          "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 3},
          "action": {"type": "expire"}}]}

  TrainingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: krx-quant-training
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: krx-quant-training
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListTheStore
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${Bucket}
                Condition:
                  StringLike: {s3:prefix: [!Ref Prefix, !Sub "${Prefix}/*"]}
              - Sid: ReadAndWriteTheStoreNoDelete
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:AbortMultipartUpload]
                Resource: !Sub arn:aws:s3:::${Bucket}/${Prefix}/*
              - Sid: LogInToTheRegistry
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PullTheImage
                Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !GetAtt Repository.Arn

  TrainingProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: krx-quant-training
      Roles: [!Ref TrainingRole]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: krx-quant-training
      LaunchTemplateData:
        ImageId: !Ref ImageId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: {Arn: !GetAtt TrainingProfile.Arn}
        InstanceMarketOptions:
          MarketType: spot
          SpotOptions:
            SpotInstanceType: one-time
            InstanceInterruptionBehavior: terminate
        # `shutdown` inside it terminates it: nothing is left running or billed.
        InstanceInitiatedShutdownBehavior: terminate
        MetadataOptions:
          HttpTokens: required
          # One hop more for the container, which reads the role's credentials through it.
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: {VolumeSize: !Ref VolumeGiB, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
        TagSpecifications:
          - ResourceType: instance
            Tags: [{Key: Name, Value: krx-quant-training}]
          - ResourceType: volume
            Tags: [{Key: Name, Value: krx-quant-training}]
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # The night's training (#23): train once from the Object Store, then terminate.
            set -uo pipefail
            # Terminate after ${MaxMinutes} minutes whatever happens, and as soon as this ends.
            shutdown -h +${MaxMinutes}
            trap 'shutdown -h now' EXIT
            log=/var/log/krx-quant-training.log
            exec >>"$log" 2>&1
            store=s3://${Bucket}/${Prefix}
            image=${Repository.RepositoryUri}:latest
            # The engine runs as uid 10001 in its image (Dockerfile): its state must be its own.
            if install -d -o 10001 -g 10001 /var/lib/krx-quant &&
              dnf install -y -q docker && systemctl start docker &&
              aws ecr get-login-password --region ${AWS::Region} |
              docker login --username AWS --password-stdin "${!image%%/*}" &&
              docker pull -q "$image"; then
              docker run --rm -e KRX_OBJECT_STORE="$store" -e AWS_REGION=${AWS::Region} \
                -e KRX_STATE_DIR=/state -v /var/lib/krx-quant:/state "$image" train --from-store
              status=$?
            else
              status=1
            fi
            echo "krx-quant training: exit $status"
            aws s3 cp "$log" "$store/training/logs/$(TZ=Asia/Seoul date +%Y-%m-%dT%H%M).log" \
              --region ${AWS::Region} --only-show-errors
            exit "$status"

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: krx-quant-training-scheduler
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
      Policies:
        - PolicyName: krx-quant-training-scheduler
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: StartTheTrainingInstance
                Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplate}
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                  - !Sub arn:aws:ec2:${AWS::Region}::image/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:spot-instances-request/*
              - Sid: TagItAtLaunch
                Effect: Allow
                Action: ec2:CreateTags
                Resource: "*"
                Condition:
                  StringEquals: {ec2:CreateAction: RunInstances}
              - Sid: ReadTheImageId
                Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}::parameter/aws/service/ami-amazon-linux-latest/*
              - Sid: HandTheInstanceItsRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt TrainingRole.Arn
                Condition:
                  StringEquals: {iam:PassedToService: ec2.amazonaws.com}
              - Sid: LetEc2RunSpotTheFirstTime
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/spot.amazonaws.com/AWSServiceRoleForEC2Spot
                Condition:
                  StringLike: {iam:AWSServiceName: spot.amazonaws.com}

  TrainingSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: krx-quant-training
      Description: The nightly training on EC2 Spot (krx-quant, #23)
      ScheduleExpression: !Ref TrainAt
      ScheduleExpressionTimezone: Asia/Seoul
      FlexibleTimeWindow: {Mode: "OFF"}
      State: ENABLED
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:runInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"LaunchTemplate": {"LaunchTemplateId": "${LaunchTemplate}", "Version": "$Latest"}, "MinCount": 1, "MaxCount": 1}'
        # Spot capacity may be short for a while: try again within the hour.
        RetryPolicy: {MaximumRetryAttempts: 5, MaximumEventAgeInSeconds: 3600}

  ResumeSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: krx-quant-training-resume
      Description: Resumes a night of krx-quant training a reclaimed Spot instance cut short (#23)
      ScheduleExpression: !Ref ResumeAt
      ScheduleExpressionTimezone: Asia/Seoul
      FlexibleTimeWindow: {Mode: "OFF"}
      State: ENABLED
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:runInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"LaunchTemplate": {"LaunchTemplateId": "${LaunchTemplate}", "Version": "$Latest"}, "MinCount": 1, "MaxCount": 1}'
        RetryPolicy: {MaximumRetryAttempts: 5, MaximumEventAgeInSeconds: 3600}

  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: krx-quant-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudget, Unit: USD}

  EnginePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: krx-quant-engine-training
      Description: What the server's engine needs for the training on EC2 Spot (#23)
      Users: [!Ref EngineUser]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LogInToTheRegistry
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: "*"
          - Sid: PushTheImage
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:CompleteLayerUpload
              - ecr:InitiateLayerUpload
              - ecr:PutImage
              - ecr:UploadLayerPart
            Resource: !GetAtt Repository.Arn
          - Sid: ReadTheBudget
            Effect: Allow
            Action: budgets:ViewBudget
            Resource: !Sub arn:aws:budgets::${AWS::AccountId}:budget/${Budget}
          - Sid: TurnTheSchedulesOffAndOn
            Effect: Allow
            Action: [scheduler:GetSchedule, scheduler:UpdateSchedule]
            Resource: [!GetAtt TrainingSchedule.Arn, !GetAtt ResumeSchedule.Arn]
          - Sid: KeepTheSchedulesRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt SchedulerRole.Arn
            Condition:
              StringEquals: {iam:PassedToService: scheduler.amazonaws.com}

Outputs:
  ImageRepository:
    Description: KRX_IMAGE_REPOSITORY in the server's .env
    Value: !GetAtt Repository.RepositoryUri
  CostBudget:
    Description: KRX_COST_BUDGET in the server's .env
    Value: !Ref Budget
  TrainingSchedules:
    Description: KRX_TRAINING_SCHEDULES in the server's .env
    Value: !Sub "${TrainingSchedule},${ResumeSchedule}"
